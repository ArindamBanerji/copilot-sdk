<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conservation law monitor</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/recharts@2.15.0/umd/Recharts.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #172033; background: #f5f7fb; }
      body { margin: 0; } main { max-width: 1120px; margin: 0 auto; padding: 32px 20px 56px; }
      h1 { margin: 0 0 8px; font-size: 30px; } h2 { margin: 0 0 16px; font-size: 18px; }
      .muted { color: #65708a; } .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin-top: 24px; }
      .card { background: white; border: 1px solid #dce2ee; border-radius: 14px; padding: 20px; box-shadow: 0 5px 18px #1720330b; }
      .gauge { position: relative; height: 24px; border-radius: 999px; background: linear-gradient(90deg, #df5d5d 0 33%, #e8bd52 33% 66%, #4aa77a 66%); margin: 30px 0 12px; }
      .needle { position: absolute; top: -9px; width: 3px; height: 42px; background: #172033; transform: translateX(-50%); }
      .threshold { border-top: 2px dashed #172033; position: absolute; top: -12px; height: 48px; }
      .labels { display: flex; justify-content: space-between; font-size: 12px; color: #65708a; }
      .metric { font-size: 30px; font-weight: 700; } .metric small { font-size: 13px; font-weight: 500; color: #65708a; }
      table { width: 100%; border-collapse: collapse; } th, td { text-align: left; padding: 9px 4px; border-bottom: 1px solid #edf0f6; }
      .bar { height: 9px; background: #e8edf5; border-radius: 9px; overflow: hidden; } .bar span { display: block; height: 100%; background: #4f76d8; }
      svg { width: 100%; height: 220px; } .legend { font-size: 12px; color: #65708a; }
    </style>
  </head>
  <body>
    <main id="root"></main>
    <script type="text/babel">
      const { useEffect, useState } = React;
      const { LineChart, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

      function number(value, fallback = 0) {
        return typeof value === "number" && Number.isFinite(value) ? value : fallback;
      }
      function Gauge({ value, threshold }) {
        const current = Math.max(0, Math.min(1, number(value)));
        const floor = Math.max(0, Math.min(1, number(threshold)));
        return <>
          <div className="gauge"><div className="needle" style={{left: `${current * 100}%`}} /><div className="threshold" style={{left: `${floor * 100}%`}} /></div>
          <div className="labels"><span>RED</span><span>YELLOW</span><span>GREEN</span></div>
          <p className="legend">Dark marker: αqV signal · dashed marker: θ_min threshold</p>
        </>;
      }
      function App() {
        const [data, setData] = useState(null);
        const [error, setError] = useState("");
        useEffect(() => { fetch("conservation_demo_data.json").then((r) => r.json()).then(setData).catch(() => setError("Run conservation_demo.py to create conservation_demo_data.json.")); }, []);
        if (error) return <main><h1>Conservation law monitor</h1><p className="muted">{error}</p></main>;
        if (!data) return <main><h1>Conservation law monitor</h1><p className="muted">Loading telemetry…</p></main>;
        const status = data.status || {}; const trajectory = data.trajectory || {}; const categories = Array.isArray(data.categories?.categories) ? data.categories.categories : [];
        const signal = number(status.signal, number(status.alpha) * number(status.q) * number(status.V));
        const threshold = number(status.theta_min, 0);
        const points = Array.isArray(trajectory.points) ? trajectory.points.map((p, i) => ({step: p.decisions ?? i + 1, iks: number(p.iks)})) : [];
        return <main>
          <h1>Interactive conservation law</h1><p className="muted">Learning remains admissible while the observed signal clears the θ_min floor.</p>
          <div className="grid">
            <section className="card"><h2>Conservation gauge</h2><Gauge value={signal / Math.max(threshold, 1)} threshold={1} /><div className="metric">{number(signal).toFixed(3)} <small>αqV signal</small></div><p className="muted">Status: {status.status || "UNKNOWN"}</p></section>
            <section className="card"><h2>Current IKS</h2><div className="metric">{number(trajectory.current_iks, number(status.iks)).toFixed(3)}</div><p className="muted">Verified decisions: {status.verified_count ?? trajectory.decisions_total ?? 0}</p><p className="muted">θ_min: {threshold.toFixed(3)}</p></section>
          </div>
          <section className="card" style={{marginTop: 16}}><h2>IKS trajectory</h2><ResponsiveContainer width="100%" height={220}><LineChart data={points}><CartesianGrid strokeDasharray="3 3" stroke="#e4e9f2"/><XAxis dataKey="step"/><YAxis/><Tooltip/><Line type="monotone" dataKey="iks" stroke="#4f76d8" strokeWidth={3} dot={false}/></LineChart></ResponsiveContainer></section>
          <section className="card" style={{marginTop: 16}}><h2>Category-level breakdown</h2><table><thead><tr><th>Category</th><th>Accuracy</th><th>Evidence volume</th></tr></thead><tbody>{categories.map((row) => <tr key={row.category}><td>{row.category}</td><td>{(number(row.accuracy) * 100).toFixed(1)}%</td><td><div className="bar"><span style={{width: `${Math.min(100, number(row.total) * 5)}%`}} /></div></td></tr>)}</tbody></table></section>
        </main>;
      }
      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
