[project]
name = "copilot-sdk"
version = "0.1.0"
requires-python = ">=3.11"
description = "Build compounding intelligence copilots on any domain."
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24.0",
    "httpx>=0.28.0",
    "graph-attention-engine @ git+https://github.com/ArindamBanerji/graph-attention-engine.git",
    # Also requires: pip install -e ../ci-platform
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "fastapi>=0.100.0", "httpx"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "copilot_sdk.data.*",
    "copilot_sdk.frontend.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "copilot_sdk.backend.*",
    "copilot_sdk.framework.*",
]
ignore_errors = true
