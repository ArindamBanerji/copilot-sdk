[project]
name = "copilot-sdk"
version = "0.1.0"
requires-python = ">=3.11"
description = "Build compounding intelligence copilots on any domain."
license = {text = "Apache-2.0"}
dependencies = [
    "numpy>=1.24.0",
    "httpx>=0.28.0",
    "click>=8.0.0",
    "graph-attention-engine @ git+https://github.com/ArindamBanerji/graph-attention-engine.git",
    # Also requires: pip install -e ../ci-platform
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "fastapi>=0.100.0", "httpx"]
trading = ["yfinance>=0.2.40", "pandas>=2.0,<2.3", "pandas-ta==0.3.14b0"]

[tool.setuptools.packages.find]
include = ["copilot_sdk*", "ci_trading*"]

[tool.setuptools.package-data]
copilot_sdk = ["di/data/*.json"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["$MYPY_CONFIG_FILE_DIR/../ci-platform", "$MYPY_CONFIG_FILE_DIR/../graph-attention-engine-v50"]
follow_imports = "skip"
warn_return_any = true
warn_unused_configs = true
exclude = [
    "copilot_sdk/migrate/",
]

[tool.pytest.ini_options]
markers = [
    "age: guarded AGE/PostgreSQL integration tests",
]

[[tool.mypy.overrides]]
module = [
    "copilot_sdk.data.*",
    "copilot_sdk.frontend.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "copilot_sdk.backend.*",
    "copilot_sdk.framework.*",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["snowflake", "snowflake.*", "tomli", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"
