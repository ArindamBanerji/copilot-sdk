[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ci-trading"
version = "0.1.0"
description = "Decision quality analysis for traders - learns which signals predict YOUR outcomes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Copilot SDK Contributors" }
]
keywords = [
  "trading",
  "decision-quality",
  "journal",
  "analytics",
  "cli",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
  "numpy>=1.24.0",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.21.0"]
ibkr = ["ib_insync>=0.9.86"]
indicators = ["pandas>=2.0.0", "pandas-ta>=0.3.14b0"]
market-data = ["yfinance>=0.2.0"]
all = [
  "alpaca-py>=0.21.0",
  "ib_insync>=0.9.86",
  "pandas>=2.0.0",
  "pandas-ta>=0.3.14b0",
  "yfinance>=0.2.0",
]
dev = ["pytest>=7.0.0"]

[project.scripts]
ci-trading = "ci_trading.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ci_trading*"]
